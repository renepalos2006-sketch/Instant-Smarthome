; Bedieneinheit – Instant Smarthome
; Zwei Umgebungen, gleicher UI-Code:
;   pio run -e simulator -t exec   -> UI als Fenster am PC (SDL2)
;   pio run -e crowpanel -t upload -> Firmware fuer das CrowPanel 7.0"

[platformio]
default_envs = simulator

[env]
lib_deps =
    lvgl/lvgl@9.2.2
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I src

[env:simulator]
platform = native
extra_scripts = pre:scripts/sim_paths.py
build_src_filter = +<app/> +<sim/>
build_flags =
    ${env.build_flags}
    -D SIMULATOR=1
    -lSDL2
; macOS: SDL2 aus Homebrew wird von scripts/sim_paths.py automatisch gefunden
; Windows (MSYS2):   siehe README

[env:crowpanel]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_src_filter = +<app/> +<esp32/>
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.1.16
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
